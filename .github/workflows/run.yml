name: run

on:
  push:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Execute the notebook top to bottom
        run: jupyter nbconvert --to notebook --execute churn_stacking.ipynb --output executed.ipynb --ExecutePreprocessor.timeout=1800
      - uses: actions/upload-artifact@v4
        with:
          name: executed-notebook
          path: executed.ipynb
